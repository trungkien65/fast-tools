name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build amd64 executable
        run: |
          mkdir -p artifacts/linux-amd64 artifacts/common
          pyinstaller --noconfirm --onefile --name fast-tools app/main.py
          cp dist/fast-tools artifacts/linux-amd64/fast-tools
          if [ -f icon.png ]; then cp icon.png artifacts/common/icon.png; fi

      - name: Build release artifacts
        run: TARGET_ARCHES=amd64 ./scripts/build-release.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            dist-release/*.tar.gz
            dist-release/*.tar.gz.sha256
