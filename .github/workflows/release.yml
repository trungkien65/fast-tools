name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build amd64 executable
        run: |
          mkdir -p artifacts/linux-amd64 artifacts/common
          pyinstaller --noconfirm --onefile --name fast-tools app/main.py
          cp dist/fast-tools artifacts/linux-amd64/fast-tools
          if [ -f icon.png ]; then cp icon.png artifacts/common/icon.png; fi

      - name: Resolve release channel
        id: release_meta
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${TAG_NAME}" == *beta* || "${TAG_NAME}" == *rc* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "release_channel=beta" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "release_channel=stable" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build release artifacts
        run: TARGET_ARCHES=amd64 RELEASE_CHANNEL=${{ steps.release_meta.outputs.release_channel }} ./scripts/build-release.sh

      - name: Verify release tag version matches package version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PACKAGE_VERSION="$(python3 -c 'import json; import sys; print(json.load(open("package.json"))["version"])')"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "${TAG_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag ${TAG_NAME} does not match package.json version ${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          files: |
            dist-release/*.tar.gz
            dist-release/*.tar.gz.sha256
